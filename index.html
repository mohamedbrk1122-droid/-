<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 30px;
        }

        .comment-box {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <h1>مرحبا بكم في موقعي 🚀</h1>
    <p>هذا أول موقع لي.</p>

    <div class="comment-box">
        <h2>💬 أضف تعليقك</h2>

        <form action="https://formspree.io/f/xbgggjnw" method="POST">

            <textarea
                name="comment"
                placeholder="اكتب تعليقك هنا..."
                required></textarea>

            <input
                type="hidden"
                name="_subject"
                value="💬 تعليق جديد على موقعي">

            <br>

            <button type="submit">إرسال التعليق</button>

        </form>
    </div>

</body>
</html>
