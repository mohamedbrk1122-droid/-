<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 25px 15px;
            margin: 0;
        }

        h1 {
            margin-bottom: 8px;
        }

        .box {
            max-width: 500px;
            margin: 25px auto;
            background: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: right;
        }

        .box h2 {
            margin: 0 0 15px;
            font-size: 20px;
            text-align: right;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 14px;
            border: 1px solid #cfd5e2;
            border-radius: 10px;
            outline: none;
            resize: none;
            font-size: 16px;
            font-family: Arial, sans-serif;
            direction: rtl;
            transition: 0.2s;
        }

        textarea::placeholder {
            color: #999;
        }

        textarea:focus {
            border-color: #1683ff;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #1683ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .report button {
            background: #1683ff;
        }
    </style>
</head>

<body>

    <h1>مرحبا بكم في موقعي 🚀</h1>
    <p>هذا أول موقع لي.</p>


    <!-- التعليق -->
    <div class="box">

        <h2>أضف تعليقك</h2>

        <form action="https://formspree.io/f/xbgggjnw" method="POST">

            <textarea
                name="comment"
                placeholder="اكتب تعليقك هنا..."
                required></textarea>

            <input
                type="hidden"
                name="type"
                value="تعليق جديد">

            <input
                type="hidden"
                name="_subject"
                value="تعليق جديد على موقعي">

            <button type="submit">
                إرسال
            </button>

        </form>

    </div>


    <!-- الإبلاغ عن خطأ -->
    <div class="box report">

        <h2>الإبلاغ عن خطأ</h2>

        <form action="https://formspree.io/f/xbgggjnw" method="POST">

            <textarea
                name="error_report"
                placeholder="اكتب الخطأ الذي واجهته..."
                required></textarea>

            <input
                type="hidden"
                name="type"
                value="بلاغ عن خطأ">

            <input
                type="hidden"
                name="_subject"
                value="بلاغ جديد عن خطأ في الموقع">

            <button type="submit">
                إرسال
            </button>

        </form>

    </div>

</body>
</html>
