<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر الأزياء النسائية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c49a6c;
  --gold-dark:#b58a5c;
  --orange:#e08a2b;
  --red:#d3001b;
  --text:#111;
  --muted:#777;
  --card:#f8f8f8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;color:var(--text);background:#fff;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}

/* ---------- Header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;max-width:1200px;margin:auto}
.logo{font-size:1.6rem;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.logo span{color:var(--gold)}
.search{flex:1;max-width:460px;display:flex;border:3px solid var(--orange);border-radius:6px;overflow:hidden;background:#fff}
.search input{flex:1;border:0;outline:0;padding:10px 14px;font-family:inherit;font-size:1rem;min-width:0}
.search button{background:var(--orange);border:0;color:#fff;width:46px;font-size:1.1rem;border-radius:50%;margin:4px}
.cart-btn{display:flex;align-items:center;gap:10px;background:var(--orange);color:#fff;border:0;border-radius:4px;padding:10px 14px;font-size:1rem;position:relative}
.cart-btn .count{background:#fff;color:var(--orange);border-radius:50%;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}

.nav{background:var(--gold)}
.nav ul{list-style:none;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:14px 10px;max-width:1200px;margin:auto}
.nav a{color:#fff;font-size:1.05rem}
